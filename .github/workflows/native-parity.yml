name: Native portability

on:
  push:
    branches: [main, go_migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.export.outputs.matrix }}
      go: ${{ steps.export.outputs.go }}
      ocaml: ${{ steps.export.outputs.ocaml }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - name: Test native packaging helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test release version identity
        run: |
          nix-instantiate --eval --strict --json nix/tests/release-identity.nix
          nix-instantiate --eval --strict --json nix/tests/release-plan.nix
      - name: Export authoritative native build metadata
        id: export
        shell: bash
        run: |
          nix build .#release-plan --out-link release-plan
          cp release-plan native-release-plan.json
          python3 - <<'PY'
          import json, os
          plan = json.load(open('native-release-plan.json'))
          if plan['sourceRevision'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Nix plan does not match the tested revision')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': plan['candidates']}) + '\n')
              for name in ('go', 'ocaml'):
                  output.write(name + '=' + plan['sources'][name]['version'] + '\n')
          PY
      - name: Bundle locked Go modules for offline builds
        run: python3 scripts/module_proxy.py --plan native-release-plan.json --output native-module-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: native-module-bundle
          path: native-module-bundle
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-plan
          path: native-release-plan.json
          if-no-files-found: error
  parity:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Applies while OCaml itself is built as well as when Tesl is linked.
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-release-plan
      - uses: actions/download-artifact@v4
        with:
          name: native-module-bundle
          path: native-module-bundle
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.plan.outputs.go }}
          cache-dependency-path: runtime/go/go.sum
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ needs.plan.outputs.ocaml }}
          windows-compiler: mingw
          cache-prefix: native-payload-macos13-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and exercise native compiler and tools
        run: python scripts/native-parity.py --plan native-release-plan.json --target ${{ matrix.target }} --module-bundle native-module-bundle
      - name: Assemble and test native candidate archive
        if: ${{ !startsWith(matrix.target, 'windows-') }}
        run: python3 scripts/native_distribution.py --plan native-release-plan.json --target ${{ matrix.target }} --module-bundle native-module-bundle --output artifacts/distribution-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(matrix.target, 'windows-') }}
        with:
          name: native-candidate-${{ matrix.target }}
          path: |
            artifacts/distribution-${{ matrix.target }}/*.tar.gz
            artifacts/distribution-${{ matrix.target }}/*.sha256
            artifacts/distribution-${{ matrix.target }}/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ matrix.target }}
          path: artifacts/native-${{ matrix.target }}/checks.json
          if-no-files-found: error
