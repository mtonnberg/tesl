# The same complete ci.sh gate runs locally in serial and on three isolated
# hosted runners. The required gate accepts only the complete, successful union
# for the checked revision; no shard alone means the repository is green.
name: CI

on:
  push:
    branches: [main, go_migration]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shards:
    name: CI (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [compiler-integration, go-runtime, migration]
    env:
      CI: 'true'
      TESL_CI_JOBS: '2'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      CI_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The migration latency comparison builds its pinned historical base.
          fetch-depth: 0

      - name: Fetch the exact migration latency baseline
        if: matrix.shard == 'migration'
        run: python3 scripts/compare-migration-latency.py --prepare-baseline --fetch-baseline

      - name: Install Nix (flakes enabled)
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Run the declared gate shard
        env:
          TESL_MIGRATION_TEST_OUTPUT: ${{ runner.temp }}/migration-evidence
        run: |
          # Each shard gets a private cluster. Migration latency runs sequentially
          # in its own runner, after its correctness workloads have stopped.
          nix develop --command bash -lc '
            set -euo pipefail
            export TESL_REPO_ROOT="$PWD"
            unset TESL_POSTGRES_HOST TESL_POSTGRES_PORT TESL_POSTGRES_USER TESL_POSTGRES_PASSWORD
            unset TESL_TEST_POSTGRES_SHARED_HOST TESL_TEST_POSTGRES_SHARED_PORT TESL_TEST_POSTGRES_SHARED_USER TESL_TEST_POSTGRES_SHARED_ADMIN_DATABASE
            ./ci.sh --shard "$CI_SHARD" --expected-revision "$GITHUB_SHA" \
              --evidence-dir "$RUNNER_TEMP/ci-evidence" 2>&1 | tee "$RUNNER_TEMP/ci-shard.log"
          '

      - name: Retain source-bound shard receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-shard-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-evidence
          if-no-files-found: error

      - name: Retain phase logs and migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ matrix.shard }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ci-shard.log
            ${{ runner.temp }}/migration-evidence
          if-no-files-found: warn

  gate:
    name: Authoritative gate (./ci.sh)
    if: always()
    needs: [shards]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the same revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read this run's shard receipts
        uses: actions/download-artifact@v4
        with:
          pattern: ci-shard-*-${{ github.sha }}
          path: ${{ runner.temp }}/ci-evidence

      - name: Verify the complete authoritative phase union
        env:
          CI_UPSTREAM_RESULT: ${{ needs.shards.result }}
        run: |
          python3 scripts/ci-shards.py verify --expected-revision "$GITHUB_SHA" \
            --evidence "$RUNNER_TEMP/ci-evidence" --upstream-result "$CI_UPSTREAM_RESULT" \
            --output "$RUNNER_TEMP/ci-verified.json"

      - name: Install Nix for verified content export
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      # Preserve the original export's executed proof/repair/example checks.
      # It rebuilds only the compiler binary, not the full OCaml test suite.
      - name: Export verified content from the checked revision
        run: nix develop --command python3 scripts/content.py export --out "${{ runner.temp }}/tesl-content.json"

      - name: Upload official content evidence
        uses: actions/upload-artifact@v4
        with:
          name: tesl-content-${{ github.sha }}
          path: ${{ runner.temp }}/tesl-content.json
          if-no-files-found: error

      - name: Retain the verified phase-union receipt
        uses: actions/upload-artifact@v4
        with:
          name: ci-verified-${{ github.sha }}
          path: ${{ runner.temp }}/ci-verified.json
          if-no-files-found: error
